server:
  port: 8080
  admin_host: "127.0.0.1"
  admin_port: 9090
  # SECURITY: Production deployments MUST set this to a random secure string.
  # If empty, key storage hashes will fall back to unsalted SHA-256.
  server_secret: ""
  max_payload_bytes: 2097152 # 2MB default limit
  read_header_timeout_seconds: 10
  read_timeout_seconds: 30
  write_timeout_seconds: 120
  idle_timeout_seconds: 120
  concurrency_timeout_seconds: 5
  strip_budget_headers: true
  dlp:
    # Outbound Semantic DLP Gate (Capability 4) — inspects LLM completion text before writing to client.
    enabled: true
    # Action on secret detection: "mask" (redact in-place) | "quarantine" (block + agent freeze)
    # PII triggers "mask" always. Only secrets trigger "quarantine".
    action: mask
    scan_secrets: true    # AWS keys, OpenAI keys, GitHub PAT, Slack tokens, JWT, PEM private keys
    scan_pii: true        # Emails, credit cards (Luhn-validated), US SSN, phone numbers
    scan_network: false   # RFC 1918 private IPs, .internal/.local/.corp hostnames
    allowed_hosts:        # Skip network detection for these hosts (e.g. local dev)
      - "localhost"
      - "example.com"
    quarantine_duration: "1h"
redis:

  addr: "localhost:6379"
  password: ""
  db: 0
log:
  level: "info"
pricing_path: "./pricing.yaml"

session:
  # The maximum number of concurrent active sessions allowed per API key.
  # Set to 0 to disable this limit. Default is disabled.
  max_per_key: 0
  # SECURITY: Allow clients to override session limits and budget via HTTP headers.
  # Should be set to false when SaaS control plane is managing policies.
  allow_client_budget_override: false
  # Multi-Turn Conversation Drift Detection (detects goal hijacking across long dialogues)
  drift_detection:
    enabled: true
    min_turns: 3                         # Minimum turns before evaluating drift
    anchor_similarity_threshold: 0.08    # Minimum trigram overlap with initial session goal
    drift_score_threshold: 0.45          # Drift score (0.0 - 1.0) above which drift is flagged

mcp:
  # SECURITY: Allow clients to override MCP constraints via HTTP headers.
  allow_client_max_tools_override: false
  allow_client_max_servers_override: false
  inspector:
    # Enable synchronous tool response inspection (indirect prompt injection wall)
    enabled: true
    # Duration to quarantine an agent key if secrets are detected in a tool response
    quarantine_duration: "1h"
    # Operator-defined plain-string patterns to flag as injection attempts
    custom_injection_patterns: []
    #  - "ignore system directive"
    #  - "disregard your role"

# ─── Persistent Agent Risk Profile (Capability 3) ──────────────────────────────
risk_profile:
  enabled: true
  ttl: "0"                           # "0" = permanent (no expiry). E.g. "720h" = 30 days.
  auto_quarantine_threshold: 75      # Risk score above this triggers 1-hour auto-quarantine.
  permanent_block_threshold: 90      # Risk score above this blocks the agent permanently.

policy:
  enabled: false
  policy_dir: "./policies"
  default_action: "deny"

alerting:
  # Loopers always emits structured security events to stdout.
  # Set webhook_url to additionally POST events to a webhook endpoint.
  webhook_url: "https://example.com/webhook"
  webhook_secret: "" # Optional HMAC-SHA256 signing key (adds X-Loopers-Signature header)
  buffer_size: 100
  thresholds:
    - percent: 50
      message: "Budget 50% consumed"
    - percent: 80
      message: "Budget 80% consumed — approaching limit"
    - percent: 95
      message: "Budget 95% consumed — imminent cutoff"

loop_detection:
  enabled: true
  fingerprint:
    threshold: 3
    # Default 60s catches rapid HFT-style agents. Consider 300s for slower, low-frequency agents.
    window_seconds: 60
    # Minimum Jaccard similarity (0.0 to 1.0) on bi-grams to consider two requests identical for loop detection
    similarity_threshold: 0.95
    # Enables structural truncation of large JSON string values (>256 chars) to prevent semantic padding attacks.
    # Set to true to defeat agent-injected random noise bypasses.
    # Default is false to preserve strict sub-millisecond JSON parsing latency.
    defeat_padding: false
  velocity:
    max_rps: 0             # disabled by default; set e.g. 10.0 to enable
    max_endpoint_repeats: 0
    repeat_window_seconds: 30
  stall:
    min_hamming_distance: 0  # disabled by default
    low_diversity_threshold: 5
    action: "warn"           # V1 default: warn only, does not block request

otel:
  # Export traces to an OTel Collector or compatible backend
  enabled: false
  # Standard OTLP endpoint (e.g. localhost:4317 for gRPC, localhost:4318 for HTTP)
  endpoint: "localhost:4317"
  # Protocol: grpc or http
  protocol: "grpc"
  insecure: true
  # Probabilistic sampling rate for successful requests (0.0 to 1.0).
  # 1.0 = trace all requests. 0.1 = trace 10%.
  # Note: Security enforcement events (blocks, warnings, auth failures) are ALWAYS traced regardless of this setting.
  sampling_rate: 1.0
  # headers:
  #   "x-honeycomb-team": "your-api-key"

zsp:
  # Enable Zero-trust Security Protocol for agent-to-agent communication and verifiable JWTs.
  enabled: false
  # URL to fetch the JWKS JSON for JWT validation
  jwt_only: false
  jwks_url: "https://auth.loopers.dev/.well-known/jwks.json"
  # Enable escalations (temporarily overriding blocks via external approval over Redis Pub/Sub)
  escalation_enabled: false
  escalation_secret: "your-hmac-secret-for-a2a-governance"

