name: Pricing Validation

env:
  GOTOOLCHAIN: auto

on:
  push:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate pricing.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          check-latest: true
          cache: true

      - name: Run Pricing Validator
        run: go run cmd/pricing-validator/main.go pricing.yaml
