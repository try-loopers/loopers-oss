name: CI

env:
  GOTOOLCHAIN: auto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: true
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Please run gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Wait for Redis service
        run: |
          host="${REDIS_PORT_6379_TCP_ADDR:-127.0.0.1}"
          port="${REDIS_PORT_6379_TCP_PORT:-6379}"
          echo "Waiting for Redis at ${host}:${port}..."
          for i in $(seq 1 30); do
            if nc -z "$host" "$port"; then
              echo "Redis is up at ${host}:${port}"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Redis did not start at ${host}:${port} after 30s" >&2
          exit 1

      - name: Run Tests and Scan for Key Leakage
        run: |
          set +e
          OUTPUT=$(go test -v -race -count=1 ./... 2>&1)
          TEST_EXIT_CODE=$?
          set -e

          if echo "$OUTPUT" | grep -E -q '(sk-[A-Za-z0-9]{32,}|sk-ant-api03-[A-Za-z0-9]{93,}|AIza[0-9A-Za-z]{35})'; then
            echo "::error::KEY LEAK DETECTED in test output!"
            exit 1
          fi

          echo "$OUTPUT"

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "=== FAILURE SUMMARY ==="
            echo "$OUTPUT" | grep -E '(FAIL:|--- FAIL|WARNING: DATA RACE|panic:)' || true
            echo "======================="
            echo "::error::Tests failed"
            exit $TEST_EXIT_CODE
          fi

      - name: Fuzz
        run: |
          go test -fuzz=FuzzCountGeminiTokensFallback -fuzztime=3s ./internal/provider/gemini

      - name: Go Vuln Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
