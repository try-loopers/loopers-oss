replicaCount: 2

image:
  repository: ghcr.io/try-loopers/loopers
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

redis:
  enabled: true
  auth:
    enabled: true
  architecture: standalone
  master:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# If using external Redis (redis.enabled=false)
externalRedis:
  host: ""
  port: 6379
  password: ""
  db: 0

# Loopers configuration parameters
config:
  logLevel: "info"
  adminHost: "0.0.0.0"
  alerting:
    webhookUrl: ""
